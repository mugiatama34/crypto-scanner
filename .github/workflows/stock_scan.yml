name: SP500 Confluence Scan

"on":
  # Hafta ici, 13:00-21:59 UTC arasi 30 dakikada bir (ABD piyasa saatini
  # hem yaz hem kis saatinde (EDT/EST) rahatlikla kapsayacak sekilde
  # genis tutuldu). Script'in kendisi is_market_open_now() ile GERCEK
  # piyasa acik/kapali durumunu ayrica kontrol ediyor - piyasa kapaliysa
  # tarama sessizce atlaniyor, bu yuzden cron'un tam dakikasi kritik degil.
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore stock state cache
        uses: actions/cache/restore@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Run stock scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_scanner.py

      - name: Save stock state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-signals-${{ github.run_id }}
          path: |
            stock_signals.json
            stock_signals.log
            stock_confluence_signals.csv
            stock_big_wave_abc.csv
            stock_double_bottom_spec.csv
          if-no-files-found: ignore
          retention-days: 30
